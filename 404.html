<style>
.notfound-main {
  min-height: calc(100vh - 120px);

  padding: 40px 20px;
}
.notfound-card {
  max-width: 520px;
  width: 100%;
  background: var(--ef-surface-white);

  border-radius: var(--radius-2xl);
  padding: 48px 36px;
  box-shadow: var(--shadow-card);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.notfound-badge {
  font-family: var(--font-family-display);
  font-size: 72px;
  font-weight: 700;
  line-height: 1;
  color: var(--ef-coral);
  margin-bottom: 16px;
}
.notfound-card h1 {
  font-family: var(--font-family-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--ef-navy);
  margin: 0 0 12px;
}
.notfound-card p {
  color: var(--ef-text-secondary);
  font-size: 15px;
  line-height: 1.6;
  margin: 0 0 28px;
}
.notfound-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
