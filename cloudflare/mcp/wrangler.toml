name = "exportflow-mcp-preview"
main = "./index.js"
compatibility_date = "2026-11-17"
workers_dev = true
preview_urls = false
keep_vars = true

# EXPORTFLOW_AUTH_DB is deliberately not bound until a dedicated D1 target is approved.
# Without this binding, execution tools fail closed; do not point it at the human AUTH_DB.

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "91420017"
simple = { limit = 30, period = 60 }

[[routes]]
pattern = "mcp.exportflow.me"
custom_domain = true


# External binding to the namespace owned by exportflow-platform.
[[durable_objects.bindings]]
name = "TENANT_BURST_LIMITER"
class_name = "TenantBurstRateLimiter"
script_name = "exportflow-platform"
