name = "exportflow-task-platform-acceptance-20261124"
main = "platform.js"
compatibility_date = "2026-11-22"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
preview_urls = false
keep_vars = false

[vars]
EXPORTFLOW_ACCEPTANCE_RUN = "durable-task-20261124"

[[d1_databases]]
binding = "EXPORTFLOW_AUTH_DB"
database_name = "exportflow-tenant-acceptance-20261122"
database_id = "1f94eee0-219e-4a41-86ce-49c29067ef06"

[[durable_objects.bindings]]
name = "TENANT_BURST_LIMITER"
class_name = "TenantBurstRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "TenantBurstRateLimiter" ]

[observability]
enabled = true
head_sampling_rate = 1
