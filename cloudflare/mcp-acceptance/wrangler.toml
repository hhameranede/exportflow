MCP_RESOURCE_URL = "https://exportflow-mcp-acceptance-20261122.hhameranede.workers.dev/mcp"
EXPORTFLOW_ACCEPTANCE_MODE = "true"

[[d1_databases]]
binding = "EXPORTFLOW_AUTH_DB"
