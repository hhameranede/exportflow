name: OAuth Acceptance

# The OAuth E2E mutates only dedicated Acceptance Workers/D1.
# It is intentionally separate from PR CI and requires an explicit sentinel
# commit on the exact feature branch. Ordinary PR syncs cannot deploy it.
on:
  push:
    branches:
      - fix/oauth-acceptance-reconciled-20261123
    paths:
      - .github/acceptance/oauth-acceptance.approved

permissions:
  contents: read

jobs:
  oauth-acceptance:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/fix/oauth-acceptance-reconciled-20261123' &&
          contains(github.event.head_commit.added, '.github/acceptance/oauth-acceptance.approved') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Shared with the one-shot owner-MFA Acceptance workflow because both
      # workflows use the same persistent Auth/Tenant Acceptance resources.
      group: exportflow-oauth-acceptance-20261122
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deployment tooling
        run: npm install --no-audit --no-fund
      - name: Run tests before any Acceptance mutation
        run: npm test && npm run check
      - name: Build isolated Acceptance bundles (dry-run only)
        run: |
          npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-acceptance --config cloudflare/auth-acceptance/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-acceptance --config cloudflare/mcp-acceptance/wrangler.toml
      - name: Verify Cloudflare credential and pinned Acceptance targets
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "435030befbb9df09ab76f69209c05347"
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -Fx 'name = "exportflow-auth-acceptance-20261122"' cloudflare/auth-acceptance/wrangler.toml
          grep -Fx 'database_id = "0dd14d21-5d56-4b01-8c0f-a14959521dde"' cloudflare/auth-acceptance/wrangler.toml
          grep -Fx 'database_id = "1f94eee0-219e-4a41-86ce-49c29067ef06"' cloudflare/auth-acceptance/wrangler.toml
          grep -Fx 'database_id = "1f94eee0-219e-4a41-86ce-49c29067ef06"' cloudflare/mcp-acceptance/wrangler.toml
          if grep -q '0bd9f873-a1d5-4d90-b3fc-1c4b47e1aa67' cloudflare/auth-acceptance/wrangler.toml; then
            echo "::error::Production AUTH_DB ID found in Auth Acceptance config."
            exit 1
          fi
          if grep -q '0bd9f873-a1d5-4d90-b3fc-1c4b47e1aa67' cloudflare/mcp-acceptance/wrangler.toml; then
            echo "::error::Production AUTH_DB ID found in MCP Acceptance config."
            exit 1
          fi
      - name: Verify the existing Better Auth encryption secret without rotating it
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config cloudflare/auth-acceptance/wrangler.toml > "$RUNNER_TEMP/oauth-acceptance-secrets.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const values = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const names = new Set(values.map((entry) => entry.name));
            if (!names.has("BETTER_AUTH_SECRET")) {
              throw new Error("Existing Acceptance BETTER_AUTH_SECRET is missing; refusing to deploy or rotate signing state.");
            }
            console.log("Existing BETTER_AUTH_SECRET is present. Its value will not be read or changed.");
          ' "$RUNNER_TEMP/oauth-acceptance-secrets.json"
      - name: Prepare temporary Google OAuth secrets for Auth Acceptance
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLIENT_ID" || { echo "::error::Missing GOOGLE_CLIENT_ID repository secret."; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "::error::Missing GOOGLE_CLIENT_SECRET repository secret."; exit 1; }
          node --input-type=module <<'NODE'
            import fs from "node:fs";
            const id = process.env.GOOGLE_CLIENT_ID;
            const secret = process.env.GOOGLE_CLIENT_SECRET;
            if (typeof id !== "string" || !id.trim() || typeof secret !== "string" || !secret.trim()) {
              throw new Error("Both Google OAuth repository secrets must be non-empty.");
            }
            const secretsFile = `${process.env.RUNNER_TEMP}/google-oauth-acceptance-secrets.json`;
            fs.writeFileSync(secretsFile, JSON.stringify({
              GOOGLE_CLIENT_ID: id,
              GOOGLE_CLIENT_SECRET: secret,
            }), { encoding: "utf8", mode: 0o600, flag: "wx" });
            console.log("Prepared the temporary Acceptance secrets file; secret values were not logged.");
          NODE
      - name: Deploy isolated Auth Acceptance Worker with Google OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/google-oauth-acceptance-secrets.json"' EXIT
          npx --yes wrangler@4 deploy --config cloudflare/auth-acceptance/wrangler.toml --secrets-file "$RUNNER_TEMP/google-oauth-acceptance-secrets.json"
      - name: Generate and install only a per-run migration token
        shell: bash
        run: |
          set -euo pipefail
          AUTH_MIGRATION_TOKEN="$(openssl rand -hex 48)"
          echo "::add-mask::$AUTH_MIGRATION_TOKEN"
          printf '%s' "$AUTH_MIGRATION_TOKEN" | npx --yes wrangler@4 secret put AUTH_MIGRATION_TOKEN --config cloudflare/auth-acceptance/wrangler.toml
          echo "AUTH_MIGRATION_TOKEN=$AUTH_MIGRATION_TOKEN" >> "$GITHUB_ENV"
      - name: Deploy isolated MCP Acceptance Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/mcp-acceptance/wrangler.toml
      - name: Run Better Auth migration on Acceptance D1 only
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/auth-migration.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $AUTH_MIGRATION_TOKEN" \
            https://exportflow-auth-acceptance-20261122.hhameranede.workers.dev/api/auth/_ops/migrate)"
          cat /tmp/auth-migration.json
          test "$status" = "200"
      - name: Verify Google OAuth is enabled in the Acceptance runtime
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/auth-config.json" --write-out '%{http_code}' \
            https://exportflow-auth-acceptance-20261122.hhameranede.workers.dev/api/auth/config)"
          test "$status" = "200"
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (config.googleEnabled !== true) {
              throw new Error("Google OAuth is not enabled in the Auth Acceptance runtime.");
            }
            console.log("Google OAuth is enabled in Acceptance; no secret values were read or logged.");
          ' "$RUNNER_TEMP/auth-config.json"
      - name: Bootstrap isolated Tenant Acceptance schema and QA plan
        shell: bash
        run: |
          set -euo pipefail
          # These migrations use IF NOT EXISTS and target only the pinned
          # Tenant Acceptance database, never the Production tenant database.
          for migration in \
            migrations/0001_tenant_auth_quota.sql \
            migrations/0002_guard_quota_period_transitions.sql \
            migrations/0003_tenant_admin_audit_log.sql \
            migrations/0004_tenant_oauth_memberships.sql; do
            npx --yes wrangler@4 d1 execute EXPORTFLOW_AUTH_DB --config cloudflare/auth-acceptance/wrangler.toml --remote --yes --file "$migration"
          done
          npx --yes wrangler@4 d1 execute EXPORTFLOW_AUTH_DB --config cloudflare/auth-acceptance/wrangler.toml --remote --yes \
            --command "INSERT INTO plan_policies (plan_code, quota_period, request_limit, policy_version, status, created_at, updated_at) VALUES ('qa_daily', 'daily', 2, 'acceptance-v1', 'active', strftime('%Y-%m-%dT%H:%M:%fZ','now'), strftime('%Y-%m-%dT%H:%M:%fZ','now')) ON CONFLICT(plan_code) DO UPDATE SET quota_period='daily', request_limit=2, policy_version='acceptance-v1', status='active', updated_at=excluded.updated_at"
      - name: Verify existing JWKS signing keys remain intact (read-only)
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"sql":"SELECT COUNT(*) AS preserved_jwks FROM jwks"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/0dd14d21-5d56-4b01-8c0f-a14959521dde/query" \
            > "$RUNNER_TEMP/oauth-acceptance-jwks.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const count = Number(payload.result?.[0]?.results?.[0]?.preserved_jwks);
            if (payload.success !== true || !Number.isSafeInteger(count) || count < 1) {
              throw new Error("Acceptance JWKS row is absent; refusing to continue with signing-key state.");
            }
            console.log("Preserved existing Acceptance JWKS rows: " + count);
          ' "$RUNNER_TEMP/oauth-acceptance-jwks.json"
      - name: Verify complete isolated OAuth, tenant and MCP flow
        run: node scripts/oauth-acceptance-smoke.mjs
