name: One-time legacy branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete all legacy branches except main (one time)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$(git log -1 --format=%s)" != "chore: clean old branch refs once" ]]; then
            echo "Not the one-time cleanup commit; no branch changes."
            exit 0
          fi
          node --input-type=module <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const base = `https://api.github.com/repos/${repository}`;
          const headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };
          const branchesResponse = await fetch(`${base}/branches?per_page=100`, { headers });
          if (!branchesResponse.ok) throw new Error(`Branch listing failed: ${branchesResponse.status} ${await branchesResponse.text()}`);
          const branches = await branchesResponse.json();
          const failures = [];
          let deleted = 0;
          for (const branch of branches) {
            if (branch.name === "main") continue;
            const path = branch.name.split("/").map(encodeURIComponent).join("/");
            const response = await fetch(`${base}/git/refs/heads/${path}`, { method: "DELETE", headers });
            if (response.status === 204) {
              deleted++;
              console.log(`deleted ${branch.name}`);
            } else {
              failures.push({ branch: branch.name, status: response.status, body: await response.text() });
            }
          }
          const verifyResponse = await fetch(`${base}/branches?per_page=100`, { headers });
          if (!verifyResponse.ok) throw new Error(`Verification failed: ${verifyResponse.status}`);
          const remaining = (await verifyResponse.json()).map(branch => branch.name);
          console.log(JSON.stringify({ deleted, failures, remaining }, null, 2));
          if (failures.length || remaining.length !== 1 || remaining[0] !== "main") {
            throw new Error("Cleanup incomplete: expected main to be the only remaining branch.");
          }
          NODE
