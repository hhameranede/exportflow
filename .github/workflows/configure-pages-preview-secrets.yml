name: Configure ExportFlow Pages Preview secrets

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: Confirm that only the Cloudflare Pages Preview environment will be changed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: exportflow-pages-preview-secrets
  cancel-in-progress: false

jobs:
  configure-preview-secrets:
    name: Upload secrets to Pages Preview only
    if: github.ref == 'refs/heads/main' && inputs.confirm_preview_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: exportflow-preview
    steps:
      - name: Check out the default branch configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate required values without displaying them
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MERCHANT_CREDENTIAL_KEYRING_JSON: ${{ secrets.MERCHANT_CREDENTIAL_KEYRING_JSON }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "GOOGLE_OAUTH_CLIENT_ID",
            "GOOGLE_OAUTH_CLIENT_SECRET",
            "MERCHANT_CREDENTIAL_KEYRING_JSON",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            throw new Error(`Missing GitHub Environment secrets: ${missing.join(", ")}`);
          }

          let keyring;
          try {
            keyring = JSON.parse(process.env.MERCHANT_CREDENTIAL_KEYRING_JSON);
          } catch {
            throw new Error("MERCHANT_CREDENTIAL_KEYRING_JSON must contain valid JSON.");
          }
          if (
            !keyring ||
            typeof keyring.activeKeyId !== "string" ||
            !keyring.keys ||
            typeof keyring.keys !== "object" ||
            Array.isArray(keyring.keys)
          ) {
            throw new Error("Keyring JSON must contain activeKeyId and keys fields.");
          }

          const encodedKey = keyring.keys[keyring.activeKeyId];
          if (typeof encodedKey !== "string") {
            throw new Error("The active key is missing from keyring.keys.");
          }
          const normalizedKey = encodedKey.replace(/\\s/g, "");
          const decodedKey = Buffer.from(normalizedKey, "base64");
          if (
            decodedKey.length !== 32 ||
            decodedKey.toString("base64") !== normalizedKey
          ) {
            throw new Error("The active key must be canonical Base64 encoding of exactly 32 bytes.");
          }
          console.log("Required values are present; keyring structure and active key length are valid.");
          NODE

      - name: Upload encrypted secrets to Preview only and verify names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MERCHANT_CREDENTIAL_KEYRING_JSON: ${{ secrets.MERCHANT_CREDENTIAL_KEYRING_JSON }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp "${RUNNER_TEMP}/exportflow-preview-secrets.XXXXXX.json")"
          trap 'rm -f "$secret_file"' EXIT

          node --input-type=module - "$secret_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          const payload = {
            GOOGLE_OAUTH_CLIENT_ID: process.env.GOOGLE_OAUTH_CLIENT_ID,
            GOOGLE_OAUTH_CLIENT_SECRET: process.env.GOOGLE_OAUTH_CLIENT_SECRET,
            MERCHANT_CREDENTIAL_KEYRING_JSON: process.env.MERCHANT_CREDENTIAL_KEYRING_JSON,
          };
          writeFileSync(process.argv[2], JSON.stringify(payload), { mode: 0o600 });
          NODE

          npx --yes wrangler@3.114.17 pages secret bulk "$secret_file" \\
            --project-name exportflow \\
            --env preview

          secret_list="$(npx --yes wrangler@3.114.17 pages secret list \\
            --project-name exportflow \\
            --env preview)"
          printf '%s\\n' "$secret_list"
          for name in \\
            GOOGLE_OAUTH_CLIENT_ID \\
            GOOGLE_OAUTH_CLIENT_SECRET \\
            MERCHANT_CREDENTIAL_KEYRING_JSON; do
            if ! grep -Fq "$name" <<< "$secret_list"; then
              echo "::error::Preview secret name missing after upload: $name"
              exit 1
            fi
          done
          echo "Preview secret names verified. Values were not read back or printed."
