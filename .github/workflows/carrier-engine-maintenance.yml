name: ExportFlow Carrier Engine Maintenance

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: exportflow-carrier-engine-maintenance
  cancel-in-progress: false

jobs:
  audit-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check upstream repositories
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-carrier-upstreams.mjs
      - name: Prepare pinned runtime update (never auto-merge)
        if: steps.audit.outputs.ups_updated == 'true'
        env:
          UPS_SHA: ${{ steps.audit.outputs.ups_sha }}
          UPS_VERSION: ${{ steps.audit.outputs.ups_version }}
        run: |
          node scripts/update-upstream-pin.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts
      - name: Run regression tests
        run: npm test
      - name: Check syntax and build
        run: |
          node --check functions/lib/exportflow-carrier-engine.mjs
          node --check functions/api/engine-status.js
          node --check scripts/check-carrier-upstreams.mjs
          node --check scripts/update-upstream-pin.mjs
          npm run build
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exportflow-carrier-upstream-report
          path: artifacts/carrier-upstream-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Open review pull request
        if: steps.audit.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh carrier upstream audit snapshot"
          branch: maintenance/carrier-upstream-audit
          delete-branch: true
          title: "chore: review carrier upstream updates"
          body-path: artifacts/carrier-upstream-report/report.md
          add-paths: |
            packages/exportflow-carrier-engine/upstream-lock.json
            package.json
            package-lock.json
            functions/lib/exportflow-carrier-engine.mjs