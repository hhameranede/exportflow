name: Owner MFA Worker Acceptance

# One-shot approval: this workflow runs only when the dedicated approval
# sentinel is added on the isolated MFA PR branch. It does not run on ordinary
# code commits, PR events, schedules, or default-branch pushes.
on:
  push:
    branches:
      - feat/owner-step-up-mfa-20261122
    paths:
      - .github/acceptance/mfa-acceptance.approved

permissions:
  contents: read

jobs:
  mfa-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: exportflow-oauth-acceptance-20261122
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deployment tooling
        run: npm install --no-audit --no-fund
      - name: Set the private ephemeral Acceptance state path
        shell: bash
        run: |
          set -euo pipefail
          echo "MFA_ACCEPTANCE_STATE_FILE=$RUNNER_TEMP/exportflow-mfa-acceptance.json" >> "$GITHUB_ENV"
      - name: Run tests before any Acceptance mutation
        run: npm test && npm run check
      - name: Verify the exact isolated Acceptance target and existing secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "435030befbb9df09ab76f69209c05347"
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -Fx 'name = "exportflow-auth-acceptance-20261122"' cloudflare/auth-acceptance/wrangler.toml
          grep -Fx 'database_id = "0dd14d21-5d56-4b01-8c0f-a14959521dde"' cloudflare/auth-acceptance/wrangler.toml
          grep -Fx 'database_id = "1f94eee0-2191-4a41-86ce-49c29067ef06"' cloudflare/auth-acceptance/wrangler.toml
          if grep -q '0bd9f873-a1d5-4d90-b3fc-1c4b47e1aa67' cloudflare/auth-acceptance/wrangler.toml; then
            echo "::error::Production AUTH_DB ID found in Acceptance config."
            exit 1
          fi
          npx --yes wrangler@4 secret list --config cloudflare/auth-acceptance/wrangler.toml > "$RUNNER_TEMP/mfa-acceptance-secrets.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const values = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const names = new Set(values.map((entry) => entry.name));
            for (const name of ["AUTH_MIGRATION_TOKEN", "BETTER_AUTH_SECRET"]) {
              if (!names.has(name)) throw new Error("Required existing Acceptance secret is missing: " + name);
            }
            console.log("Both existing Acceptance secrets are present; neither will be rotated.");
          ' "$RUNNER_TEMP/mfa-acceptance-secrets.json"
          node --check scripts/mfa-acceptance-smoke.mjs
          node --check scripts/mfa-acceptance-migrate.mjs
      - name: Deploy the PR Auth Worker to the isolated Acceptance Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/auth-acceptance/wrangler.toml --message "PR #107 isolated owner MFA Acceptance; existing secrets preserved"
      - name: Apply additive Better Auth 1.7.27 schema to Acceptance AUTH_DB only
        run: node scripts/mfa-acceptance-migrate.mjs
      - name: Create synthetic account and verify first TOTP enrollment
        run: node scripts/mfa-acceptance-smoke.mjs bootstrap
      - name: Add the synthetic account to the isolated Worker owner allowlist
        id: owner_allowlist
        shell: bash
        run: |
          set -euo pipefail
          OWNER_ID="$(node scripts/mfa-acceptance-smoke.mjs owner-id)"
          test -n "$OWNER_ID"
          echo "::add-mask::$OWNER_ID"
          npx --yes wrangler@4 deploy --config cloudflare/auth-acceptance/wrangler.toml \
            --var "EXPORTFLOW_OWNER_USER_IDS:$OWNER_ID" \
            --message "PR #107 temporary synthetic MFA owner allowlist"
      - name: Verify owner guards, session-bound proof, replay and D1 attempt limits
        run: node scripts/mfa-acceptance-smoke.mjs verify
      - name: Remove the temporary owner allowlist from the Acceptance Worker
        if: ${{ always() && steps.owner_allowlist.outcome != 'skipped' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy --config cloudflare/auth-acceptance/wrangler.toml --message "PR #107 clear temporary MFA owner allowlist"
      - name: Remove synthetic MFA account and plan from Acceptance D1
        if: ${{ always() }}
        run: node scripts/mfa-acceptance-smoke.mjs cleanup
