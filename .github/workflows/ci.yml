name: Verify ExportFlow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: exportflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies (frozen npm lockfile)
        run: npm ci --no-audit --no-fund --foreground-scripts
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check translations.js
          node --check coverage.js
          node --check functions/api/track.js
          node --check functions/api/carriers.js
          node --check functions/api/coverage.js
          node --check functions/api/health.js
          node --check functions/_middleware.js
          node --check scripts/locale-build-test.mjs
          node --check scripts/stage-third-party-licenses.mjs
          node --check scripts/third-party-licenses-test.mjs
          node --check functions/lib/country-codes.mjs
          node --check 'functions/api/merchant/carriers/[provider]/mock.js'
          node --check scripts/official-api-mock-route-test.mjs
          node --check scripts/datadog-ci-test-events.cjs
      - name: Run regression tests with optional Datadog Test Visibility
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "::warning::DD_API_KEY is not configured; regression tests will run normally and Datadog Test Visibility upload will be skipped."
            npm test
          else
            DATADOG_TRACER_DIR="$RUNNER_TEMP/exportflow-datadog-tracer"
            mkdir -p "$DATADOG_TRACER_DIR"
            if npm install --prefix "$DATADOG_TRACER_DIR" --no-save --no-package-lock --no-audit --no-fund dd-trace@6.24.0; then
              DD_CIVISIBILITY_AGENTLESS_ENABLED=true \
              DD_API_KEY="$DD_API_KEY" \
              DD_SITE=us5.datadoghq.com \
              DD_SERVICE=exportflow \
              DD_ENV=ci \
              DD_TEST_SESSION_NAME=exportflow-regression \
              NODE_OPTIONS="-r $DATADOG_TRACER_DIR/node_modules/dd-trace/ci/init -r $GITHUB_WORKSPACE/scripts/datadog-ci-test-events.cjs ${NODE_OPTIONS:-}" \
              npm test
            else
              echo "::warning::Datadog tracer installation failed; regression tests will run without Test Visibility upload."
              npm test
            fi
          fi
      - name: Build Cloudflare Pages output
        run: npm run build
      - name: Verify localized SEO pages and hreflang sitemap
        run: node scripts/locale-build-test.mjs
      - name: Bundle Pages Functions with production Wrangler
        run: npx --yes wrangler@3.114.17 pages functions build functions --outdir .wrangler/pages-functions
      - name: Verify all public build artifacts
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/translations.js
          test -s dist/coverage.js
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/favicon.svg
          test -s dist/favicon-32x32.png
          test -s dist/apple-touch-icon.png
          test -s dist/site.webmanifest
          test -s dist/og-image-20261106.png
          test -s dist/coverage/index.html
          test -s dist/about/index.html
          test -s dist/contact/index.html
          test -s dist/privacy/index.html
          test -s dist/terms/index.html
          test -s dist/cookies/index.html
          test -s dist/security/index.html
          test -s dist/disclaimer/index.html
          test -s dist/licenses/index.html
          test -s dist/licenses/manifest.json
          test -s dist/licenses/THIRD_PARTY_NOTICES.md
          test -s dist/licenses/EXPORTFLOW_MODIFICATIONS.md
          node scripts/third-party-licenses-test.mjs
