name: Worker CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          EXPORTFLOW_DEFUDDLE_INTEGRATION: "1"
      - run: npm run check
