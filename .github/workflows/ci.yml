name: Verify ExportFlow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: exportflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check functions/api/track.js
          node --check functions/api/carriers.js
          node --check functions/api/health.js
      - name: Run smoke tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html && test -s dist/styles.css && test -s dist/app.js
