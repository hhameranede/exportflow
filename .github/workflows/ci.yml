name: Verify ExportFlow (Cloudflare)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exportflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (frozen npm lockfile)
        run: npm ci --no-audit --no-fund --foreground-scripts
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check translations.js
          node --check coverage.js
          node --check functions/api/track.js
          node --check functions/api/carriers.js
          node --check functions/api/coverage.js
          node --check functions/api/health.js
          node --check functions/api/batch-track.js
          node --check functions/api/openapi.js
          node --check functions/api/mcp.js
          node --check scripts/mcp-test.mjs
          node --check exportflow-sdk.mjs
          node --check merchant.js
          node --check merchant-utils.mjs
          node --check scripts/merchant-workspace-test.mjs
          node --check scripts/batch-track-test.mjs
          node --check scripts/openapi-test.mjs
          node --check scripts/sdk-test.mjs
          node --check functions/api/merchant/auth/google/start.js
          node --check functions/api/merchant/auth/google/callback.js
          node --check functions/api/merchant/session.js
          node --check functions/api/merchant/track.js
          node --check scripts/merchant-tracking-route-test.mjs
          node --check scripts/security-headers-test.mjs
          node --check 'functions/api/merchant/carriers/[provider]/credentials.js'
          node --check 'functions/api/merchant/carriers/[provider]/official-credentials.js'
          node --check 'functions/api/merchant/carriers/[provider]/sandbox.js'
          node --check functions/lib/official-api-credential-vault.mjs
          node --check scripts/official-api-credential-vault-test.mjs
          node --check scripts/official-api-sandbox-route-test.mjs
          node --check functions/_middleware.js
          node --check functions/lib/merchant-identity.mjs
          node --check functions/lib/session-bound-merchant-vault.mjs
          node --check functions/lib/company-snapshot-kv.mjs
          node --check scripts/company-snapshot-kv-test.mjs
          node --check functions/lib/acra-normalizer.mjs
          node --check scripts/acra-normalizer-test.mjs
          node --check functions/lib/gleif-normalizer.mjs
          node --check scripts/gleif-normalizer-test.mjs
          node --check functions/lib/global-rate-limit-policy.mjs
          node --check functions/lib/global-rate-limiter.mjs
          node --check workers/global-rate-limiter/src/index.mjs
          node --check scripts/global-rate-limiter-test.mjs
          node --check scripts/global-rate-limit-route-test.mjs
          node --check scripts/carrier-evidence-test.mjs
          node --check functions/api/carrier-directory.js
          node --check scripts/carrier-directory-test.mjs
          node --check scripts/generate-exportflow-carrier-catalog.mjs
          node --check scripts/carrier-catalog-snapshot-test.mjs
          node --check scripts/carrier-official-api-contract-test.mjs
          node --check scripts/carrier-sandbox-validation.mjs
          node --check scripts/carrier-sandbox-validation-test.mjs
          node --check scripts/merchant-identity-test.mjs
          node --check scripts/session-bound-merchant-vault-test.mjs
          node --check scripts/locale-build-test.mjs
          node --check scripts/run-datadog-tests.mjs
          node --check scripts/production-smoke-test.mjs
          node --check scripts/production-smoke-test-unit.mjs
          node --check functions/lib/country-codes.mjs
          node --check scripts/materialize-vendor-sources.mjs
          node --check scripts/materialize-dz-delivery.mjs
      - name: Validate D1 migrations and integrity constraints
        run: python3 scripts/d1-migration-test.py
      - name: Detect Datadog Test Optimization configuration
        id: datadog-config
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [[ -n "${DD_API_KEY}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Datadog Test Optimization is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Datadog API key is not configured; regression tests will run without telemetry."
          fi
      - name: Configure Datadog Test Optimization
        if: steps.datadog-config.outputs.enabled == 'true'
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: us5.datadoghq.com
      - name: Run regression tests
        run: npm test
        env:
          NODE_OPTIONS: ${{ steps.datadog-config.outputs.enabled == 'true' && format('-r {0}', env.DD_TRACE_PACKAGE) || '' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com
          DD_CIVISIBILITY_AGENTLESS_ENABLED: ${{ steps.datadog-config.outputs.enabled }}
          DD_SERVICE: exportflow
          DD_ENV: ci
          DD_TEST_SESSION_NAME: exportflow-regression
      - name: Validate Durable Object Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config workers/global-rate-limiter/wrangler.toml
      - name: Build Cloudflare Pages output
        run: npm run build
      - name: Verify localized SEO pages and hreflang sitemap
        run: node scripts/locale-build-test.mjs
      - name: Bundle Cloudflare Pages Functions with Wrangler
        run: npx --yes wrangler@3.114.17 pages functions build functions --outdir .wrangler/pages-functions
      - name: Verify all public build artifacts
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/translations.js
          test -s dist/coverage.js
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/favicon.svg
          test -s dist/favicon-32x32.png
          test -s dist/apple-touch-icon.png
          test -s dist/site.webmanifest
          test -s dist/og-image-20261106.png
          test -s dist/coverage/index.html
          test -s dist/developers/index.html
          test -s dist/merchant/index.html
          test -s dist/merchant.js
          test -s dist/merchant-utils.mjs
          test -s dist/exportflow-sdk.mjs
          test -s dist/about/index.html
          test -s dist/contact/index.html
          test -s dist/privacy/index.html
          test -s dist/terms/index.html
          test -s dist/cookies/index.html
          test -s dist/security/index.html
          test -s dist/disclaimer/index.html
