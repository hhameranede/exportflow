name: Worker CI
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - run: npm test
   - run: npm run check
   - name: Install pinned Playwright and Chromium outside project dependencies
     run: |
      npm install --prefix "$RUNNER_TEMP/ef-browser" --no-save --package-lock=false playwright@1.65.1
      "$RUNNER_TEMP/ef-browser/node_modules/.bin/playwright" install --only-shell chromium
   - name: Run real Chromium website checks
     env:
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/ef-browser/node_modules/playwright/index.mjs
      SITE_SCREENSHOT_DIR: ${{ runner.temp }}/exportflow-site-screenshots
     run: node scripts/site-browser-check.mjs
   - name: Upload browser screenshots
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-site-browser-review
      path: ${{ runner.temp }}/exportflow-site-screenshots
      if-no-files-found: warn
      retention-days: 3
   - name: Build isolated Auth Lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-lab --config cloudflare/auth-lab/wrangler.toml
   - name: Locate Wrangler build output
     run: |
      echo "Root dist output:"
      find dist -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Lab config-relative output:"
      find cloudflare/auth-lab -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Wrangler internal output:"
      find .wrangler -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
   - name: Upload isolated Auth Lab bundle artifact
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-auth-lab-bundle-${{ github.sha }}
      path: |
       dist/
       cloudflare/auth-lab/dist/
       .wrangler/
      if-no-files-found: error
      retention-days: 1
      include-hidden-files: true

 deploy-production:
  needs: test
  if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: authorized Production auth deployment' }}"
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Deploy official Cloudflare Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
      npx --yes wrangler@4 deploy --config wrangler.toml
