name: Worker CI
on:
 push:
  branches: [main]
 pull_request:
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - run: npm test
   - run: npm run check
   - name: Build isolated Auth Lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-lab --config cloudflare/auth-lab/wrangler.toml
   - name: Build MCP Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-preview --config cloudflare/mcp/wrangler.toml
   - name: Build isolated Auth Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-acceptance --config cloudflare/auth-acceptance/wrangler.toml
   - name: Build isolated MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-acceptance --config cloudflare/mcp-acceptance/wrangler.toml
   - name: Locate Wrangler build output
     run: |
      echo "Root dist output:"
      find dist -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Lab config-relative output:"
      find cloudflare/auth-lab -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Wrangler internal output:"
      find .wrangler -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
   - name: Upload isolated Worker bundles
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-acceptance-bundles-${{ github.sha }}
      path: |
       dist/
       cloudflare/auth-lab/dist/
       .wrangler/
      if-no-files-found: error
      retention-days: 1
      include-hidden-files: true

 deploy-production:
  needs: test
  if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: authorized Production auth deployment' }}"
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Deploy official Cloudflare Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
      npx --yes wrangler@4 deploy --config wrangler.toml

 deploy-oauth-acceptance:
  needs: test
  if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/oauth-environment-endpoints-20261122' && github.event.pull_request.base.ref == 'feat/oauth-tenant-memberships-20261121' }}"
  runs-on: ubuntu-latest
  env:
   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
   CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - name: Install deployment tooling
     run: npm install --no-audit --no-fund
   - name: Verify Cloudflare credential exists
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Deploy isolated Auth Acceptance Worker
     run: npx --yes wrangler@4 deploy --config cloudflare/auth-acceptance/wrangler.toml
   - name: Generate and install test-only Better Auth secrets
     shell: bash
     run: |
      set -euo pipefail
      BETTER_AUTH_SECRET="$(openssl rand -hex 48)"
      AUTH_MIGRATION_TOKEN="$(openssl rand -hex 48)"
      echo "::add-mask::$BETTER_AUTH_SECRET"
      echo "::add-mask::$AUTH_MIGRATION_TOKEN"
      printf '%s' "$BETTER_AUTH_SECRET" | npx --yes wrangler@4 secret put BETTER_AUTH_SECRET --config cloudflare/auth-acceptance/wrangler.toml
      printf '%s' "$AUTH_MIGRATION_TOKEN" | npx --yes wrangler@4 secret put AUTH_MIGRATION_TOKEN --config cloudflare/auth-acceptance/wrangler.toml
      echo "AUTH_MIGRATION_TOKEN=$AUTH_MIGRATION_TOKEN" >> "$GITHUB_ENV"
   - name: Deploy isolated MCP Acceptance Worker
     run: npx --yes wrangler@4 deploy --config cloudflare/mcp-acceptance/wrangler.toml
   - name: Run Better Auth migration on acceptance D1 only
     shell: bash
     run: |
      set -euo pipefail
      status="$(curl --silent --show-error --output /tmp/auth-migration.json --write-out '%{http_code}' \
       --request POST \
       --header "Authorization: Bearer $AUTH_MIGRATION_TOKEN" \
       https://exportflow-auth-acceptance-20261122.hhameranede.workers.dev/api/auth/_ops/migrate)"
      cat /tmp/auth-migration.json
      test "$status" = "200"
   - name: Verify complete isolated OAuth, tenant and MCP flow
     run: node scripts/oauth-acceptance-smoke.mjs
