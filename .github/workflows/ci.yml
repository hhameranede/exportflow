name: Worker CI

# Keep one full QA run per PR; never cancel a main release workflow.
concurrency:
 group: worker-ci-${{ github.event.pull_request.number || github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
 push:
  branches: [main, feat/durable-task-lifecycle-v1-20261124]
 pull_request:

jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - run: npm test
   - run: npm run check
   - name: Install pinned Playwright and Chromium outside project dependencies
     run: |
      npm install --prefix "$RUNNER_TEMP/ef-browser" --no-save --package-lock=false playwright@1.65.1
      "$RUNNER_TEMP/ef-browser/node_modules/.bin/playwright" install --only-shell chromium
   - name: Run full-site Chromium QA (all routes, locales, icons and mobile widths)
     env:
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/ef-browser/node_modules/playwright/index.mjs
      SITE_SCREENSHOT_DIR: ${{ runner.temp }}/exportflow-site-qa
     run: node scripts/site-browser-qa.mjs
   - name: Upload full-site browser QA report and screenshots
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-full-site-qa
      path: ${{ runner.temp }}/exportflow-site-qa
      if-no-files-found: warn
      retention-days: 3
   - name: Build isolated Auth Lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-lab --config cloudflare/auth-lab/wrangler.toml
   - name: Build Platform Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/platform --config wrangler.toml
   - name: Build MCP Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-preview --config cloudflare/mcp/wrangler.toml
   - name: Build tenant Platform Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/tenant-platform-acceptance --config cloudflare/acceptance/tenant-platform.wrangler.toml
   - name: Build tenant MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/tenant-mcp-acceptance --config cloudflare/acceptance/tenant-mcp.wrangler.toml
   - name: Build isolated OAuth Auth Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-acceptance --config cloudflare/auth-acceptance/wrangler.toml
   - name: Build isolated OAuth MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-acceptance --config cloudflare/mcp-acceptance/wrangler.toml
   - name: Build Task Platform Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/task-platform-acceptance --config cloudflare/task-acceptance/platform.wrangler.toml
   - name: Build Task MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/task-mcp-acceptance --config cloudflare/task-acceptance/mcp.wrangler.toml
   - name: Locate Wrangler build output
     run: |
      echo "Root dist output:"
      find dist -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Lab config-relative output:"
      find cloudflare/auth-lab -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Wrangler internal output:"
      find .wrangler -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
   - name: Upload isolated Auth Lab bundle artifact
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-auth-lab-bundle-${{ github.sha }}
      path: |
       dist/
       cloudflare/auth-lab/dist/
       .wrangler/
      if-no-files-found: error
      retention-days: 1
      include-hidden-files: true

 deploy-acceptance:
  needs: test
  if: >-
   ${{ github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/durable-task-lifecycle-v1-20261124' }}
  runs-on: ubuntu-latest
  env:
   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
   CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Verify isolated Acceptance deployment credentials
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Apply migration 0005 to the dedicated Acceptance D1 database only
     run: npx --yes wrangler@4 d1 execute exportflow-tenant-acceptance-20261122 --remote --file migrations/0005_durable_task_lifecycle.sql --config cloudflare/task-acceptance/platform.wrangler.toml --yes
   - name: Deploy isolated Task Platform Acceptance Worker
     run: npx --yes wrangler@4 deploy --config cloudflare/task-acceptance/platform.wrangler.toml
   - name: Deploy isolated Task MCP Acceptance Worker
     run: npx --yes wrangler@4 deploy --config cloudflare/task-acceptance/mcp.wrangler.toml
   - name: Seed run-scoped synthetic tenants and API keys
     run: node scripts/acceptance/durable-task-runtime.mjs seed
   - name: Run real Cloudflare D1 + Worker durable Task acceptance
     run: node scripts/acceptance/durable-task-runtime.mjs smoke
   - name: Clean up run-scoped synthetic Acceptance data
     if: always()
     run: node scripts/acceptance/durable-task-runtime.mjs cleanup
 deploy-production:
  needs: test
  if: >-
   ${{ github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (startsWith(github.event.head_commit.message, 'chore: authorized ExportFlow release') ||
        startsWith(github.event.head_commit.message, 'Merge pull request #94 from hhameranede/fix/mcp-streaming-body-limit-20261121')) }}
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Verify Cloudflare deployment credentials
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Deploy official ExportFlow Platform Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: npx --yes wrangler@4 deploy --config wrangler.toml
   - name: Deploy official ExportFlow MCP Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: npx --yes wrangler@4 deploy --config cloudflare/mcp/wrangler.toml
   - name: Read-only production smoke checks
     run: |
      node --input-type=module <<'NODE'
      const checks = [
        ["platform-health", "https://exportflow.me/api/v1/health"],
        ["mcp-health", "https://mcp.exportflow.me/health"],
      ];
      for (const [name, url] of checks) {
        const response = await fetch(url, { headers: { accept: "application/json" } });
        const text = await response.text();
        if (!response.ok) throw new Error(name + " returned HTTP " + response.status + ": " + text.slice(0, 300));
        let body;
        try { body = JSON.parse(text); } catch { throw new Error(name + " did not return JSON"); }
        if (body.status !== "ok") throw new Error(name + " returned an unexpected health payload");
        console.log(name + ": HTTP " + response.status + " OK");
      }

      const initResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: 1,
          method: "initialize",
          params: {
            protocolVersion: "2025-11-25",
            capabilities: {},
            clientInfo: { name: "exportflow-release-smoke", version: "1.0.0" },
          },
        }),
      });
      if (!initResponse.ok) throw new Error("MCP initialize returned HTTP " + initResponse.status + ": " + (await initResponse.text()).slice(0, 300));
      const init = await initResponse.json();
      if (init.result?.serverInfo?.name !== "ExportFlow" || init.result?.protocolVersion !== "2025-11-25") {
        throw new Error("MCP initialize returned an unexpected response");
      }
      console.log("mcp-initialize: HTTP " + initResponse.status + " OK");

      const listResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
      });
      if (!listResponse.ok) throw new Error("MCP tools/list returned HTTP " + listResponse.status + ": " + (await listResponse.text()).slice(0, 300));
      const listed = await listResponse.json();
      const names = listed.result?.tools?.map((tool) => tool.name) || [];
      for (const expected of ["exportflow_capabilities", "web_fetch", "web_map", "web_crawl", "web_extract"]) {
        if (!names.includes(expected)) throw new Error("MCP tools/list is missing " + expected);
      }
      console.log("mcp-tools-list: HTTP " + listResponse.status + " OK (" + names.length + " tools)");

      const capabilityResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: 3,
          method: "tools/call",
          params: { name: "exportflow_capabilities", arguments: {} },
        }),
      });
      if (!capabilityResponse.ok) throw new Error("MCP capabilities call returned HTTP " + capabilityResponse.status + ": " + (await capabilityResponse.text()).slice(0, 300));
      const capabilities = await capabilityResponse.json();
      if (capabilities.result?.isError || capabilities.result?.structuredContent?.name !== "ExportFlow") {
        throw new Error("MCP capabilities tool returned an unexpected response");
      }
      console.log("mcp-capabilities: HTTP " + capabilityResponse.status + " OK");
      NODE
