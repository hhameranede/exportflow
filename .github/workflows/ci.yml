name: Worker CI
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - run: npm test
   - run: npm run check
   - name: Build isolated Auth Lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-lab --config cloudflare/auth-lab/wrangler.toml
   - name: Build isolated Better Auth owner-session lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/auth-session-lab --config cloudflare/auth-session-lab/wrangler.toml
   - name: Build MCP Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir dist/mcp-preview --config cloudflare/mcp/wrangler.toml
   - name: Locate Wrangler build output
     run: |
      echo "Root dist output:"
      find dist -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Lab config-relative output:"
      find cloudflare/auth-lab -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Owner session lab config-relative output:"
      find cloudflare/auth-session-lab -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      echo "Wrangler internal output:"
      find .wrangler -maxdepth 5 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
   - name: Upload isolated Auth Lab bundle artifact
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-auth-lab-bundle-${{ github.sha }}
      path: |
       dist/
       cloudflare/auth-lab/dist/
       cloudflare/auth-session-lab/dist/
       .wrangler/
      if-no-files-found: error
      retention-days: 1
      include-hidden-files: true
   - name: Create unique temporary Owner Auth D1 and ephemeral secrets
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      set -euo pipefail
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Cloudflare test resource token is unavailable."
       exit 1
      fi
      LAB_WORKER_NAME="exportflow-owner-session-lab-${GITHUB_RUN_ID}"
      LAB_DB_NAME="exportflow-owner-auth-${GITHUB_RUN_ID}"
      LAB_CONFIG_FILE="cloudflare/auth-session-lab/.wrangler-${GITHUB_RUN_ID}.toml"
      CREATE_JSON="$RUNNER_TEMP/owner-session-lab-d1-create.json"
      curl --fail --silent --show-error -X POST \
       -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
       -H "Content-Type: application/json" \
       --data "$(node -e 'process.stdout.write(JSON.stringify({name:process.argv[1],read_replication:{mode:"disabled"}}))' "$LAB_DB_NAME")" \
       "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" > "$CREATE_JSON"
      LAB_DB_ID="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.success!==true || !x.result?.uuid) process.exit(1); process.stdout.write(x.result.uuid)' "$CREATE_JSON")"
      cat > "$LAB_CONFIG_FILE" <<EOF
      name = "$LAB_WORKER_NAME"
      main = "worker.js"
      compatibility_date = "2026-11-20"
      compatibility_flags = ["nodejs_compat"]
      workers_dev = true
      preview_urls = false
      observability = { enabled = false }

      [vars]
      BETTER_AUTH_URL = "https://$LAB_WORKER_NAME.hhameranede.workers.dev"

      [[d1_databases]]
      binding = "AUTH_DB"
      database_name = "$LAB_DB_NAME"
      database_id = "$LAB_DB_ID"
      EOF
      AUTH_LAB_SECRET="$(openssl rand -hex 32)"
      SESSION_LAB_TOKEN="$(openssl rand -hex 32)"
      echo "::add-mask::$AUTH_LAB_SECRET"
      echo "::add-mask::$SESSION_LAB_TOKEN"
      printf 'LAB_WORKER_NAME=%s\n' "$LAB_WORKER_NAME" >> "$GITHUB_ENV"
      printf 'LAB_DB_NAME=%s\n' "$LAB_DB_NAME" >> "$GITHUB_ENV"
      printf 'LAB_DB_ID=%s\n' "$LAB_DB_ID" >> "$GITHUB_ENV"
      printf 'LAB_CONFIG_FILE=%s\n' "$LAB_CONFIG_FILE" >> "$GITHUB_ENV"
      printf 'AUTH_LAB_SECRET=%s\n' "$AUTH_LAB_SECRET" >> "$GITHUB_ENV"
      printf 'SESSION_LAB_TOKEN=%s\n' "$SESSION_LAB_TOKEN" >> "$GITHUB_ENV"

   - name: Deploy temporary Better Auth session lab Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      set -euo pipefail
      npx --yes wrangler@4 deploy --config "$LAB_CONFIG_FILE"
      printf '%s' "$AUTH_LAB_SECRET" | npx --yes wrangler@4 secret put BETTER_AUTH_SECRET --config "$LAB_CONFIG_FILE"
      printf '%s' "$SESSION_LAB_TOKEN" | npx --yes wrangler@4 secret put SESSION_LAB_TOKEN --config "$LAB_CONFIG_FILE"

   - name: Verify real Better Auth owner session cookies against isolated Worker and D1
     run: |
      set -euo pipefail
      BASE_URL="https://${LAB_WORKER_NAME}.hhameranede.workers.dev"
      COOKIE_JAR="$RUNNER_TEMP/owner-session-lab-cookies.txt"
      SIGNUP_JSON="$RUNNER_TEMP/owner-session-lab-signup.json"
      DECISION_JSON="$RUNNER_TEMP/owner-session-lab-decision.json"
      EMAIL="owner-session-lab-${GITHUB_RUN_ID}@example.com"
      PASSWORD="$(openssl rand -hex 24)"
      HEALTH_JSON="$RUNNER_TEMP/owner-session-lab-health.json"
      sleep 3
      if ! HEALTH_STATUS="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 30 --output "$HEALTH_JSON" --write-out "%{http_code}" \
       "$BASE_URL/__session_lab/health")"; then
       echo "Session lab Worker health request could not connect after retry."
       node -e 'try { const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||null,ok:x.ok||false})); } catch { console.log("No JSON liveness response was received."); }' "$HEALTH_JSON"
       exit 1
      fi
      echo "Session lab Worker health HTTP status: $HEALTH_STATUS"
      node -e 'try { const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({ok:x.ok===true,sessionLabTokenConfigured:x.sessionLabTokenConfigured===true,authDbBindingPresent:x.authDbBindingPresent===true})); if(x.ok!==true || x.sessionLabTokenConfigured!==true || x.authDbBindingPresent!==true) process.exit(1); } catch { process.exit(1); }' "$HEALTH_JSON"
      if [ "$HEALTH_STATUS" != "200" ]; then
       echo "Session lab Worker health probe failed."
       exit 1
      fi

      SIGNUP_STATUS="$(curl --silent --show-error --cookie-jar "$COOKIE_JAR" --output "$SIGNUP_JSON" --write-out "%{http_code}" \
       -H "x-session-lab-token: $SESSION_LAB_TOKEN" \
       -H "content-type: application/json" \
       -H "origin: $BASE_URL" \
       --data "$(node -e 'process.stdout.write(JSON.stringify({name:"Synthetic Owner Session Lab",email:process.argv[1],password:process.argv[2]}))' "$EMAIL" "$PASSWORD")" \
       "$BASE_URL/__session_lab/signup")"
      if [ "$SIGNUP_STATUS" != "200" ]; then
       echo "Synthetic Better Auth signup failed with HTTP $SIGNUP_STATUS."
       node -e 'try { const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||null,code:x.code||null,message:x.message||null,status:x.status||null,upstreamStatus:x.upstreamStatus||null})); } catch { console.log("Non-JSON signup response."); }' "$SIGNUP_JSON"
       exit 1
      fi
      OWNER_ID="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.user?.id) process.exit(1); process.stdout.write(x.user.id)' "$SIGNUP_JSON")"
      test -s "$COOKIE_JAR"
      SESSION_JSON="$RUNNER_TEMP/owner-session-lab-session.json"
      curl --fail --silent --show-error --cookie "$COOKIE_JAR" -H "origin: $BASE_URL" \
       "$BASE_URL/api/auth/get-session" > "$SESSION_JSON"
      node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.user?.id!==process.argv[2] || x.user?.emailVerified!==true) process.exit(1)' "$SESSION_JSON" "$OWNER_ID"

      lab_control() {
       local label="$2"
       local CONTROL_JSON="$RUNNER_TEMP/owner-session-lab-control.json"
       echo "CONTROL_START: $label"
       local gate_status
       gate_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
        -H "x-session-lab-token: $SESSION_LAB_TOKEN" "$BASE_URL/__session_lab/health-auth")"
       if [ "$gate_status" != "200" ]; then
        echo "Session lab token gate failed before control action '$label' (HTTP $gate_status)."
        exit 1
       fi
       local status
       status="$(curl --silent --show-error --output "$CONTROL_JSON" --write-out "%{http_code}" \
        -H "x-session-lab-token: $SESSION_LAB_TOKEN" \
        -H "origin: $BASE_URL" -H "sec-fetch-site: same-origin" \
        -H "content-type: application/json" --data "$1" "$BASE_URL/__session_lab/control")"
       if [ "$status" != "200" ]; then
        echo "Session lab control action '$label' failed (HTTP $status)."
        node -e 'try { const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||null,sessionLabTokenConfigured:x.sessionLabTokenConfigured||false,tokenHeaderPresent:x.tokenHeaderPresent||false})); } catch { console.log("Non-JSON control response."); }' "$CONTROL_JSON"
        exit 1
       fi
       echo "CONTROL_PASS: $label"
      }
      assert_access() {
       local label="$1" expected="$2" cookie="$3" owner="$4" origin="$5" fetch_site="$6"
       local args=(--silent --show-error --output "$DECISION_JSON" --write-out "%{http_code}" -X POST \
        -H "x-session-lab-token: $SESSION_LAB_TOKEN" -H "x-session-lab-owner-id: $owner" \
        -H "origin: $origin" -H "sec-fetch-site: $fetch_site")
       if [ "$cookie" = "yes" ]; then args+=(--cookie "$COOKIE_JAR"); fi
       local status
       status="$(curl "${args[@]}" "$BASE_URL/__session_lab/authorize")"
       test "$status" = "200"
       node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const expected=process.argv[2]==="true"; if(x.allowed!==expected || (expected && x.actorMatches!==true)) process.exit(1)' "$DECISION_JSON" "$expected"
       echo "PASS: $label"
      }

      assert_access "fresh verified owner cookie accepted by production authorizePlatformOwner()" true yes "$OWNER_ID" "$BASE_URL" same-origin
      assert_access "request without session cookie denied" false no "$OWNER_ID" "$BASE_URL" same-origin
      assert_access "non-allowlisted user ID denied" false yes "${OWNER_ID}_other" "$BASE_URL" same-origin
      assert_access "mismatched Origin denied" false yes "$OWNER_ID" "https://attacker.example" cross-site
      lab_control "$(node -e 'process.stdout.write(JSON.stringify({action:"unverify",userId:process.argv[1]}))' "$OWNER_ID")" "unverify"
      assert_access "unverified account denied despite valid session cookie" false yes "$OWNER_ID" "$BASE_URL" same-origin
      lab_control "$(node -e 'process.stdout.write(JSON.stringify({action:"verify",userId:process.argv[1]}))' "$OWNER_ID")" "verify"
      lab_control "$(node -e 'process.stdout.write(JSON.stringify({action:"stale",userId:process.argv[1]}))' "$OWNER_ID")" "stale"
      assert_access "session older than ten minutes denied" false yes "$OWNER_ID" "$BASE_URL" same-origin
      lab_control "$(node -e 'process.stdout.write(JSON.stringify({action:"fresh",userId:process.argv[1]}))' "$OWNER_ID")" "fresh"
      lab_control "$(node -e 'process.stdout.write(JSON.stringify({action:"expired",userId:process.argv[1]}))' "$OWNER_ID")" "expired"
      assert_access "expired session denied" false yes "$OWNER_ID" "$BASE_URL" same-origin
      echo "PASS: Better Auth real D1 session-cookie runtime acceptance completed."

   - name: Delete temporary Better Auth session lab Worker and D1
     if: always()
     continue-on-error: true
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      set -u
      if [ -n "${LAB_CONFIG_FILE:-}" ] && [ -f "$LAB_CONFIG_FILE" ]; then
       npx --yes wrangler@4 delete --config "$LAB_CONFIG_FILE" --force || echo "::warning::Temporary auth lab Worker deletion did not verify."
      fi
      if [ -n "${LAB_DB_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
       if curl --fail --silent --show-error -X DELETE \
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
        "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$LAB_DB_ID" >/dev/null; then
        echo "Temporary auth lab D1 deleted."
       else
        echo "::warning::Temporary auth lab D1 deletion did not verify."
       fi
      fi
      if [ -n "${LAB_CONFIG_FILE:-}" ]; then rm -f "$LAB_CONFIG_FILE"; fi


 deploy-production:
  needs: test
  if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: authorized Production auth deployment' }}"
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Deploy official Cloudflare Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
      npx --yes wrangler@4 deploy --config wrangler.toml
