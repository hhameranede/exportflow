name: Verify ExportFlow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: exportflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check functions/api/track.js
          node --check functions/api/carriers.js
          node --check functions/api/health.js
          node --check scripts/carrier-catalog-test.mjs
      - name: Run smoke tests and full carrier catalog audit
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html && test -s dist/styles.css && test -s dist/app.js
      - name: Verify deployed Pages API
        if: github.event_name == 'pull_request'
        env:
          EXPORTFLOW_PREVIEW_URL: https://ff81c6c4.exportflow-aja.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = process.env.EXPORTFLOW_PREVIEW_URL;
          assert.ok(base, 'Preview URL must be configured');

          const healthResponse = await fetch(`${base}/api/health`);
          assert.equal(healthResponse.status, 200, 'GET /api/health must return HTTP 200');
          const health = await healthResponse.json();
          assert.equal(health.ok, true);
          assert.equal(health.service, 'exportflow-tracking-api');
          assert.equal(health.engine, 'universal-parcel-scraper');

          const carriersResponse = await fetch(`${base}/api/carriers`);
          assert.equal(carriersResponse.status, 200, 'GET /api/carriers must return HTTP 200');
          const catalog = await carriersResponse.json();
          assert.ok(Array.isArray(catalog.carriers), 'Carrier catalog must be an array');
          assert.equal(catalog.catalogEntries, catalog.carriers.length);
          assert.ok(catalog.catalogEntries >= 1300, 'Carrier catalog appears incomplete');
          assert.equal(new Set(catalog.carriers).size, catalog.carriers.length, 'Carrier IDs must be unique');
          assert.ok(
            catalog.carriers.every(id => typeof id === 'string' && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)),
            'Every carrier ID must use the expected normalized format'
          );

          async function postTrack(body, contentType = 'application/json') {
            return fetch(`${base}/api/track`, {
              method: 'POST',
              headers: { 'Content-Type': contentType, 'Accept': 'application/json' },
              body: typeof body === 'string' ? body : JSON.stringify(body)
            });
          }

          const cases = [
            { label: 'invalid number', body: { number: 'x' }, status: 400, error: 'invalid_tracking_number' },
            { label: 'invalid carrier', body: { number: 'TESTTRACK123', carrier: 'bad carrier!' }, status: 400, error: 'invalid_carrier' },
            { label: 'invalid postcode', body: { number: 'TESTTRACK123', postcode: '<bad>' }, status: 400, error: 'invalid_postcode' },
            { label: 'invalid language', body: { number: 'TESTTRACK123', language: 'zz-ZZ' }, status: 400, error: 'invalid_language' },
            { label: 'unknown field', body: { number: 'TESTTRACK123', extra: true }, status: 400, error: 'unknown_request_field' },
            { label: 'wrong content type', body: '{"number":"TESTTRACK123"}', contentType: 'text/plain', status: 415, error: 'content_type_must_be_json' }
          ];

          const validation = {};
          for (const testCase of cases) {
            const response = await postTrack(testCase.body, testCase.contentType);
            assert.equal(response.status, testCase.status, `${testCase.label} must return HTTP ${testCase.status}`);
            const payload = await response.json();
            assert.equal(payload.error, testCase.error, `${testCase.label} must return ${testCase.error}`);
            validation[testCase.label] = 'ok';
          }

          console.log(JSON.stringify({
            health: 'ok',
            carriers: catalog.catalogEntries,
            carrierIdsUnique: true,
            validation
          }, null, 2));
          NODE
