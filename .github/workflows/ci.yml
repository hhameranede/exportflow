name: Worker CI

# Keep one full QA run per PR; never cancel a main release workflow.
concurrency:
 group: worker-ci-${{ github.event.pull_request.number || github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.head_commit.message == 'acceptance: run isolated P0 Stage 2 six-operation acceptance') }}

on:
 workflow_dispatch:
  inputs:
   run_acceptance:
    description: "Run the isolated Cloudflare Acceptance migration and Worker tests"
    type: boolean
    required: true
    default: false
 push:
  branches: [main, feat/durable-task-lifecycle-v1-20261124, feat/p0-stage2-six-operation-acceptance-20261127]
 pull_request:

jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - run: npm test
   - run: npm run check
   - name: Install pinned Playwright and Chromium outside project dependencies
     if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'acceptance: run isolated P0 Stage 2 six-operation acceptance') }}
     run: |
      npm install --prefix "$RUNNER_TEMP/ef-browser" --no-save --package-lock=false playwright@1.65.1
      "$RUNNER_TEMP/ef-browser/node_modules/.bin/playwright" install --only-shell chromium
   - name: Run full-site Chromium QA (all routes, locales, icons and mobile widths)
     if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'acceptance: run isolated P0 Stage 2 six-operation acceptance') }}
     env:
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/ef-browser/node_modules/playwright/index.mjs
      SITE_SCREENSHOT_DIR: ${{ runner.temp }}/exportflow-site-qa
     run: node scripts/site-browser-qa.mjs
   - name: Upload full-site browser QA report and screenshots
     if: ${{ always() && !(github.event_name == 'push' && github.event.head_commit.message == 'acceptance: run isolated P0 Stage 2 six-operation acceptance') }}
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-full-site-qa
      path: ${{ runner.temp }}/exportflow-site-qa
      if-no-files-found: warn
      retention-days: 3
   - name: Build isolated Auth Lab bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/auth-lab" --config cloudflare/auth-lab/wrangler.toml
   - name: Build Platform Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/platform" --config wrangler.toml
   - name: Build MCP Worker bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/mcp-preview" --config cloudflare/mcp/wrangler.toml
   - name: Build tenant Platform Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/tenant-platform-acceptance" --config cloudflare/acceptance/tenant-platform.wrangler.toml
   - name: Build tenant MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/tenant-mcp-acceptance" --config cloudflare/acceptance/tenant-mcp.wrangler.toml
   - name: Build isolated OAuth Auth Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/auth-acceptance" --config cloudflare/auth-acceptance/wrangler.toml
   - name: Build isolated OAuth MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/mcp-acceptance" --config cloudflare/mcp-acceptance/wrangler.toml
   - name: Build Task Platform Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/task-platform-acceptance" --config cloudflare/task-acceptance/platform.wrangler.toml
   - name: Build Task MCP Acceptance bundle (dry-run only)
     run: npx --yes wrangler@4 deploy --dry-run --outdir "$GITHUB_WORKSPACE/dist/task-mcp-acceptance" --config cloudflare/task-acceptance/mcp.wrangler.toml
   - name: Assert and inventory all nine Wrangler bundles
     shell: bash
     run: |
      set -euo pipefail
      for mapping in auth-lab/index.js platform/index.js mcp-preview/index.js tenant-platform-acceptance/tenant-platform.js tenant-mcp-acceptance/tenant-mcp.js auth-acceptance/index.js mcp-acceptance/index.js task-platform-acceptance/platform.js task-mcp-acceptance/mcp.js; do
       bundle="${mapping%%/*}"
       entrypoint="${mapping#*/}"
       output="$GITHUB_WORKSPACE/dist/$bundle/$entrypoint"
       if [[ ! -s "$output" ]]; then
        echo "::error::Expected Worker entrypoint is missing: $output"
        find "$GITHUB_WORKSPACE/dist" -maxdepth 4 -type f -printf "%p %s bytes\n" || true
        exit 1
       fi
       echo "$bundle/$entrypoint: $(stat -c '%s bytes' "$output")"
      done
      find "$GITHUB_WORKSPACE/dist" -maxdepth 4 -type f -printf "%p %s bytes\n" | sort
   - name: Upload all nine Worker bundle artifacts
     uses: actions/upload-artifact@v4
     with:
      name: exportflow-worker-bundles-${{ github.sha }}
      path: dist/
      if-no-files-found: error
      retention-days: 3
      include-hidden-files: true

   # External recursive-resolver observations are diagnostic only. They do not prove
   # the Cloudflare Worker's actual connection destination or private-IP enforcement.
   - name: "Diagnostic only: 1u.ms resolver observations (non-gating; not Worker acceptance)"
     if: github.event_name == 'pull_request' && github.event.pull_request.number == 142
     continue-on-error: true
     run: node scripts/acceptance/rbndr-dns-preflight.mjs

 deploy-acceptance:
  needs: test
  # Acceptance mutates only dedicated test resources; require an explicit manual opt-in.
  if: >-
   ${{ (github.event_name == 'workflow_dispatch' &&
        inputs.run_acceptance == true &&
        github.ref == 'refs/heads/feat/p0-request-only-fetch-20261125') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.number == 142) }}
  runs-on: ubuntu-latest
  env:
   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
   CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
  steps:
   - uses: actions/checkout@v4
     with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
   # One-time user-approved trigger: the commit subject must start with "acceptance: run isolated P0 Stage 1 acceptance".
   - name: Gate the one-time approved Acceptance run
     id: acceptance-gate
     env:
      EVENT_NAME: ${{ github.event_name }}
      RUN_ACCEPTANCE: ${{ inputs.run_acceptance }}
     run: |
      set -euo pipefail
      subject="$(git log -1 --format=%s)"
      if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_ACCEPTANCE" == "true" ]] || [[ "$subject" == "acceptance: run isolated P0 Stage 1 acceptance"* ]]; then
       echo "run=true" >> "$GITHUB_OUTPUT"
       echo "The isolated P0 Acceptance run is explicitly enabled for this invocation."
      else
       echo "run=false" >> "$GITHUB_OUTPUT"
       echo "Skipping Acceptance deployment; this PR commit is not the one-time acceptance trigger."
      fi
   - uses: actions/setup-node@v4
     if: steps.acceptance-gate.outputs.run == 'true'
     with:
      node-version: 24
   - name: Install dependencies for isolated Acceptance
     if: steps.acceptance-gate.outputs.run == 'true'
     run: npm install --no-audit --no-fund
   - name: Verify isolated Acceptance deployment credentials
     if: steps.acceptance-gate.outputs.run == 'true'
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Apply migration 0005 to the dedicated Acceptance D1 database only
     if: steps.acceptance-gate.outputs.run == 'true'
     run: npx --yes wrangler@4 d1 execute exportflow-tenant-acceptance-20261122 --remote --file migrations/0005_durable_task_lifecycle.sql --config cloudflare/task-acceptance/platform.wrangler.toml --yes
   - name: Deploy isolated Task Platform Acceptance Worker
     if: steps.acceptance-gate.outputs.run == 'true'
     run: npx --yes wrangler@4 deploy --config cloudflare/task-acceptance/platform.wrangler.toml
   - name: Deploy isolated Task MCP Acceptance Worker
     if: steps.acceptance-gate.outputs.run == 'true'
     run: npx --yes wrangler@4 deploy --config cloudflare/task-acceptance/mcp.wrangler.toml
   - name: Seed run-scoped synthetic tenants and API keys
     if: steps.acceptance-gate.outputs.run == 'true'
     run: node scripts/acceptance/durable-task-runtime.mjs seed
   - name: Run real Cloudflare D1 + Worker durable Task acceptance
     if: steps.acceptance-gate.outputs.run == 'true'
     run: node scripts/acceptance/durable-task-runtime.mjs smoke
   - name: Clean up run-scoped synthetic Acceptance data
     if: always() && steps.acceptance-gate.outputs.run == 'true'
     run: node scripts/acceptance/durable-task-runtime.mjs cleanup
 stage2-acceptance:
  needs: test
  if: >-
   ${{ github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/p0-stage2-six-operation-acceptance-20261127' &&
        github.event.head_commit.message == 'acceptance: run isolated P0 Stage 2 six-operation acceptance' }}
  runs-on: ubuntu-latest
  timeout-minutes: 20
  env:
   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
   CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
  steps:
   - uses: actions/checkout@v4
     with:
      ref: ${{ github.sha }}
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - name: Verify isolated Acceptance D1 credentials
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Seed one run-scoped synthetic Stage 2 tenant and API key
     id: stage2-seed
     run: node scripts/acceptance/stage2-task-runtime.mjs seed
   - name: Run all six operations over REST and MCP on existing Acceptance Workers
     if: steps.stage2-seed.outcome == 'success'
     run: node scripts/acceptance/stage2-task-runtime.mjs smoke
   - name: Clean only this run's Stage 2 Acceptance data
     if: always() && steps.stage2-seed.outcome != 'skipped'
     run: node scripts/acceptance/stage2-task-runtime.mjs cleanup

 deploy-production:
  needs: test
  if: >-
   ${{ github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (startsWith(github.event.head_commit.message, 'chore: authorized ExportFlow release') ||
        startsWith(github.event.head_commit.message, 'Merge pull request #94 from hhameranede/fix/mcp-streaming-body-limit-20261121')) }}
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
   - run: npm install --no-audit --no-fund
   - name: Verify Cloudflare deployment credentials
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
     run: |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
       echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) GitHub Actions secret."
       exit 1
      fi
   - name: Deploy official ExportFlow Platform Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: npx --yes wrangler@4 deploy --config wrangler.toml
   - name: Deploy official ExportFlow MCP Worker
     env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
     run: npx --yes wrangler@4 deploy --config cloudflare/mcp/wrangler.toml
   - name: Read-only production smoke checks
     run: |
      node --input-type=module <<'NODE'
      const checks = [
        ["platform-health", "https://exportflow.me/api/v1/health"],
        ["mcp-health", "https://mcp.exportflow.me/health"],
      ];
      for (const [name, url] of checks) {
        const response = await fetch(url, { headers: { accept: "application/json" } });
        const text = await response.text();
        if (!response.ok) throw new Error(name + " returned HTTP " + response.status + ": " + text.slice(0, 300));
        let body;
        try { body = JSON.parse(text); } catch { throw new Error(name + " did not return JSON"); }
        if (body.status !== "ok") throw new Error(name + " returned an unexpected health payload");
        console.log(name + ": HTTP " + response.status + " OK");
      }

      const initResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: 1,
          method: "initialize",
          params: {
            protocolVersion: "2025-11-25",
            capabilities: {},
            clientInfo: { name: "exportflow-release-smoke", version: "1.0.0" },
          },
        }),
      });
      if (!initResponse.ok) throw new Error("MCP initialize returned HTTP " + initResponse.status + ": " + (await initResponse.text()).slice(0, 300));
      const init = await initResponse.json();
      if (init.result?.serverInfo?.name !== "ExportFlow" || init.result?.protocolVersion !== "2025-11-25") {
        throw new Error("MCP initialize returned an unexpected response");
      }
      console.log("mcp-initialize: HTTP " + initResponse.status + " OK");

      const listResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
      });
      if (!listResponse.ok) throw new Error("MCP tools/list returned HTTP " + listResponse.status + ": " + (await listResponse.text()).slice(0, 300));
      const listed = await listResponse.json();
      const names = listed.result?.tools?.map((tool) => tool.name) || [];
      for (const expected of ["exportflow_capabilities", "web_fetch", "web_map", "web_crawl", "web_extract"]) {
        if (!names.includes(expected)) throw new Error("MCP tools/list is missing " + expected);
      }
      console.log("mcp-tools-list: HTTP " + listResponse.status + " OK (" + names.length + " tools)");

      const capabilityResponse = await fetch("https://mcp.exportflow.me/mcp", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream",
          "mcp-protocol-version": "2025-11-25",
        },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: 3,
          method: "tools/call",
          params: { name: "exportflow_capabilities", arguments: {} },
        }),
      });
      if (!capabilityResponse.ok) throw new Error("MCP capabilities call returned HTTP " + capabilityResponse.status + ": " + (await capabilityResponse.text()).slice(0, 300));
      const capabilities = await capabilityResponse.json();
      if (capabilities.result?.isError || capabilities.result?.structuredContent?.name !== "ExportFlow") {
        throw new Error("MCP capabilities tool returned an unexpected response");
      }
      console.log("mcp-capabilities: HTTP " + capabilityResponse.status + " OK");
      NODE
