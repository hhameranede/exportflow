name: Verify ExportFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: exportflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html && test -s dist/styles.css && test -s dist/app.js