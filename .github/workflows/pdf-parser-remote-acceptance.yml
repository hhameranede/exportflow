name: Isolated PDF Parser Remote Acceptance

on:
  push:
    branches:
      - acceptance/p0-pdf-parser-remote-20261127

permissions:
  contents: read

jobs:
  remote-pdf-acceptance:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/acceptance/p0-pdf-parser-remote-20261127' &&
        github.event.head_commit.message == 'acceptance: run isolated P0 PDF parser remote Acceptance'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 435030befbb9df09ab76f69209c05347
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify explicit approval commit marker and isolated target
        shell: bash
        env:
          BASE_SHA: 0730ba827053943ada8655dac5286ff778f08ebb
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/acceptance/p0-pdf-parser-remote-20261127"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git log -1 --format=%s)" = "acceptance: run isolated P0 PDF parser remote Acceptance"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          expected="$(printf '%s\n' ".github/workflows/pdf-parser-remote-acceptance.yml" "package.json" "scripts/acceptance/pdf-parser-remote-smoke.mjs")"
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected files outside the isolated PDF Acceptance harness."
            exit 1
          fi
          grep -Fxq 'name = "exportflow-pdf-parser-compat"' cloudflare/pdf-parser-compat/wrangler.toml
          if grep -Eq '^(route|routes|workers_dev[[:space:]]*=[[:space:]]*false)' cloudflare/pdf-parser-compat/wrangler.toml; then
            echo "::error::PDF Acceptance config must remain workers.dev-only with no custom routes."
            exit 1
          fi
          echo "Preflight passed: exact branch, one-shot marker and isolated Worker target."
      - name: Check remote Acceptance harness syntax before any deployment
        run: node --check scripts/acceptance/pdf-parser-remote-smoke.mjs
      - name: Verify required GitHub Actions credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          PDF_PARSER_SMOKE_TOKEN: ${{ secrets.PDF_PARSER_SMOKE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          token_length="${#PDF_PARSER_SMOKE_TOKEN}"
          if (( token_length < 32 )); then
            echo "::error::PDF_PARSER_SMOKE_TOKEN GitHub Actions secret is missing or too short."
            exit 1
          fi
          echo "Required credential names are available; values are not printed."
      - name: Install Worker build dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy candidate source to isolated PDF Acceptance Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config cloudflare/pdf-parser-compat/wrangler.toml
      - name: Run authenticated remote PDF Acceptance using synthetic fixtures only
        env:
          PDF_PARSER_SMOKE_TOKEN: ${{ secrets.PDF_PARSER_SMOKE_TOKEN }}
        run: node scripts/acceptance/pdf-parser-remote-smoke.mjs
