name: One-time parser dependency evidence bootstrap

on:
  push:
    branches:
      - feat/open-source-parser-eval-20261127

permissions:
  contents: read

jobs:
  bootstrap-parser-evidence:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/open-source-parser-eval-20261127' && contains(github.event.head_commit.message, '[bootstrap-parser-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and validate deterministic npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Audit parser runtime dependency licenses
        run: node scripts/audit-parser-dependency-licenses.mjs "$RUNNER_TEMP/parser-runtime-licenses.json"
      - name: Generate scoped SPDX 2.3 parser dependency SBOM
        run: |
          mkdir -p docs/sbom
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const inventory = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/parser-runtime-licenses.json", "utf8"));
          const roots = ["@mozilla/readability", "linkedom", "papaparse"];
          const lockPackages = lock.packages;
          const inventoryByPath = new Map();

          for (const item of inventory.packages) {
            for (const location of item.locations) {
              inventoryByPath.set(location.replace(/\/package\.json$/, ""), item);
            }
          }

          function locate(name, fromPath) {
            let current = fromPath;
            while (true) {
              const candidate = path.posix.join(current, "node_modules", ...name.split("/"));
              if (lockPackages[candidate]) return candidate;
              if (!current) return null;
              const parent = path.posix.dirname(current);
              if (parent === current) return null;
              current = parent;
            }
          }

          const rootPaths = new Map();
          for (const name of roots) {
            const location = locate(name, "");
            if (!location) throw new Error("Missing parser root in lockfile: " + name);
            rootPaths.set(name, location);
          }

          const visited = new Set();
          const edges = new Set();

          function visit(location) {
            if (visited.has(location)) return;
            visited.add(location);
            const manifest = lockPackages[location];
            for (const dependency of Object.keys(manifest.dependencies || {}).sort()) {
              const target = locate(dependency, location);
              if (!target) throw new Error("Missing locked dependency " + dependency + " required by " + location);
              edges.add(JSON.stringify([location, target]));
              visit(target);
            }
          }

          for (const location of rootPaths.values()) visit(location);

          if (inventory.missingRequiredDependencies.length ||
              inventory.missingLicenseMetadata.length ||
              inventory.missingExplicitLicenseFiles.length) {
            throw new Error("Parser license audit reported unresolved metadata or license-file gaps");
          }
          if (visited.size !== inventory.packageCount ||
              [...visited].some((location) => !inventoryByPath.has(location))) {
            throw new Error("Parser SBOM closure does not match the audited dependency inventory");
          }

          const ids = new Map(
            [...visited].sort().map((location) => [
              location,
              "SPDXRef-Pkg-" + createHash("sha256").update(location).digest("hex").slice(0, 16),
            ])
          );

          const packages = [{
            name: "ExportFlow",
            SPDXID: "SPDXRef-ExportFlow",
            versionInfo: lock.version,
            downloadLocation: "NOASSERTION",
            filesAnalyzed: false,
            licenseConcluded: "NOASSERTION",
            licenseDeclared: "NOASSERTION",
            copyrightText: "NOASSERTION",
            primaryPackagePurpose: "APPLICATION",
          }];

          for (const location of [...visited].sort()) {
            const locked = lockPackages[location];
            const audited = inventoryByPath.get(location);
            const integrity = locked.integrity || "";
            if (!integrity.startsWith("sha512-")) {
              throw new Error("Missing SHA-512 npm integrity for " + location);
            }
            if (!audited.license) throw new Error("Missing declared license for " + location);

            const packageName = audited.name;
            const purlName = packageName.startsWith("@")
              ? "%40" + packageName.slice(1)
              : packageName;

            packages.push({
              name: packageName,
              SPDXID: ids.get(location),
              versionInfo: audited.version,
              downloadLocation: locked.resolved || "NOASSERTION",
              filesAnalyzed: false,
              licenseConcluded: "NOASSERTION",
              licenseDeclared: audited.license,
              copyrightText: "NOASSERTION",
              checksums: [{
                algorithm: "SHA512",
                checksumValue: Buffer.from(integrity.slice("sha512-".length), "base64").toString("hex"),
              }],
              externalRefs: [{
                referenceCategory: "PACKAGE-MANAGER",
                referenceType: "purl",
                referenceLocator: "pkg:npm/" + purlName + "@" + audited.version,
              }],
              primaryPackagePurpose: "LIBRARY",
            });
          }

          const relationships = [...rootPaths.values()].map((location) => ({
            spdxElementId: "SPDXRef-ExportFlow",
            relationshipType: "DEPENDS_ON",
            relatedSpdxElement: ids.get(location),
          }));

          for (const edge of edges) {
            const [from, to] = JSON.parse(edge);
            relationships.push({
              spdxElementId: ids.get(from),
              relationshipType: "DEPENDS_ON",
              relatedSpdxElement: ids.get(to),
            });
          }

          const sbom = {
            spdxVersion: "SPDX-2.3",
            dataLicense: "CC0-1.0",
            SPDXID: "SPDXRef-DOCUMENT",
            name: "ExportFlow Parser Runtime Dependency SBOM",
            documentNamespace: "https://spdx.org/spdxdocs/exportflow-parser-runtime-20261127-c7cc30b367fc8094e8a0c1350c1587665754e6d2",
            creationInfo: {
              created: inventory.generatedAt,
              creators: ["Tool: ExportFlow parser runtime SPDX generator"],
              licenseListVersion: "3.27",
            },
            documentDescribes: ["SPDXRef-ExportFlow"],
            documentComment: "Scope: ExportFlow runtime dependency closure for parser roots @mozilla/readability, linkedom, papaparse. Includes " +
              visited.size + " exact npm packages from package-lock.json (lockfileVersion " + lock.lockfileVersion +
              "). This is intentionally not a complete application SBOM. Declared license identifiers are package metadata; " +
              "licenseConcluded is NOASSERTION and does not replace legal/commercial license review.",
            packages,
            relationships,
          };

          const idsInDocument = new Set(packages.map((item) => item.SPDXID));
          for (const relation of relationships) {
            if (!idsInDocument.has(relation.spdxElementId) || !idsInDocument.has(relation.relatedSpdxElement)) {
              throw new Error("SPDX relationship points to a missing package");
            }
          }

          writeFileSync("docs/sbom/exportflow-parser-runtime.spdx.json", JSON.stringify(sbom, null, 2) + "\n");
          console.log("SPDX 2.3 parser SBOM: " + visited.size + " dependencies, " + relationships.length + " dependency edges");
          NODE
      - name: Commit parser lockfile and SPDX SBOM to the isolated PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/sbom/exportflow-parser-runtime.spdx.json
          if git diff --cached --quiet; then
            echo "Lockfile and SBOM are already current."
            exit 0
          fi
          git commit -m "chore: commit deterministic parser dependency lock and SPDX SBOM"
          git push origin "HEAD:$GITHUB_REF_NAME"
