name: Run Laguna XS 2.1

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: ExportFlow issue to execute
        required: true
        default: 29
        type: number
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: exportflow-laguna-${{ github.event.issue.number || inputs.issue_number || 29 }}
  cancel-in-progress: false

jobs:
  laguna:
    name: Laguna XS 2.1 engineering run
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Authorize owner trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || 29 }}
        run: |
          echo "Trigger event: ${EVENT_NAME}; actor: ${ACTOR}; issue: ${ISSUE_NUMBER}"
          if [[ "${ACTOR}" != "hhameranede" ]]; then
            echo "::error::Only hhameranede may run Laguna."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${IS_PULL_REQUEST}" == "true" ]]; then
              echo "::error::Use a normal issue, not a pull request conversation."
              exit 1
            fi
            IFS= read -r first_line <<< "${COMMENT_BODY}"
            if [[ "${first_line}" != "/laguna-run" ]]; then
              echo "::error::The first comment line must be /laguna-run."
              exit 1
            fi
          elif [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::Unsupported trigger."
            exit 1
          fi
          echo "Owner trigger authorized."

      - name: Verify NVIDIA secret exists
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [[ -z "${NVIDIA_API_KEY}" ]]; then
            echo "::error::Missing Actions secret NVIDIA_API_KEY."
            exit 1
          fi
          echo "NVIDIA_API_KEY is configured; value not displayed."

      - name: Smoke-test Laguna XS 2.1
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          response_file="$RUNNER_TEMP/laguna-smoke.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://integrate.api.nvidia.com/v1/chat/completions" \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"model":"poolside/laguna-xs-2.1","messages":[{"role":"user","content":"Reply READY only."}],"max_tokens":8,"stream":false}')"
          if [[ "$status" != "200" ]]; then
            echo "::error::NVIDIA Laguna smoke test returned HTTP ${status}; response body withheld."
            exit 1
          fi
          if ! jq -e '.choices[0].message.content | type == "string"' "$response_file" >/dev/null; then
            echo "::error::NVIDIA returned an unexpected Laguna response."
            exit 1
          fi
          echo "NVIDIA accepted poolside/laguna-xs-2.1 and returned a valid completion."

      - name: Check out ExportFlow
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure commit identity
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Laguna XS 2.1
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: nvidia/poolside/laguna-xs-2.1
          use_github_token: true
          prompt: |
            You are Laguna XS 2.1, the long-horizon engineering executor authorized by the ExportFlow repository owner.

            Execute ExportFlow issue #${{ github.event.issue.number || inputs.issue_number || 29 }}. Read the issue and all comments first. Inspect the current codebase, PR #30, and PR #24 before changing code. Reuse sound work and avoid duplicate implementations.

            Implement substantive improvements in the actual application. Follow the issue roadmap phase by phase. Run relevant tests, diagnose failures, repair them, and perform a final review. Open one coherent, review-ready pull request against main. Do not stop at a plan or documentation.

            Safety constraints:
            - Work only in this repository on a dedicated feature branch.
            - Never push directly to main, merge, or deploy.
            - Never access Cloudflare, Vercel, DNS, production services, remote databases, or external account dashboards.
            - Never read, print, copy, or expose secrets or environment variable values.
            - Do not change repository secrets, permissions, billing, GitHub Apps, or account settings.
            - Do not delete user data, migrations, features, or important project files.
            - Never invent carrier integrations, tracking data, delivery estimates, country support, statistics, or test results.
            - Keep shipment identifiers and personal tracking data out of logs.
            - Do not intentionally trigger deployment workflows.
            - Preserve the existing architecture, stack, design direction, and working behavior unless a justified change is required.

            Follow the issue's mandatory self-repair protocol. Report exact commands and truthful outcomes. Leave the resulting PR open and unmerged.
