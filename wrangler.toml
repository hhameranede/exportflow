# Cloudflare Pages Functions runtime and Node compatibility.
name = "exportflow"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

# Global API abuse control: the namespace is owned by the separate Worker below.
# Preview and Production share the namespace but use distinct HMAC-derived object
# names through EXPORTFLOW_ENV, keeping their counters isolated.
[[durable_objects.bindings]]
name = "GLOBAL_RATE_LIMITER"
class_name = "GlobalRateLimiter"
script_name = "exportflow-global-rate-limiter"

# Merchant identity and encrypted carrier credentials use Cloudflare D1 only.
# Production and preview are isolated databases in the EU jurisdiction.
[[d1_databases]]
binding = "MERCHANT_DB"
database_name = "exportflow-intelligence-db"
database_id = "3e91ee40-75f8-45b3-9459-a4c306f52b3b"
preview_database_id = "DB" # Local Pages development uses an isolated Miniflare database.
migrations_dir = "migrations"
