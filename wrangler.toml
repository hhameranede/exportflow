# Required by Pages Functions and the universal parcel engine's Node.js built-ins.
name = "exportflow"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

# Preview-only telemetry storage. Keep this out of the top-level and production
# configuration so Production never receives this binding by inheritance.
[[env.preview.d1_databases]]
binding = "EXPORTFLOW_TELEMETRY_DB"
database_name = "exportflow-tracking-telemetry-preview-db"
database_id = "decef588-a198-4bdd-9764-e0ce2e2caaee"
preview_database_id = "local-exportflow-telemetry"
migrations_dir = "migrations/telemetry"

# Merchant workspace: D1/session and limiter bindings are Preview-only.
[env.preview.vars]
EXPORTFLOW_ENV = "preview"
MERCHANT_APP_ORIGIN = "https://feat-merchant-official-api-p.exportflow-aja.pages.dev"

[[env.preview.d1_databases]]
binding = "MERCHANT_DB"
database_name = "exportflow-intelligence-preview-db"
database_id = "9657dfdc-5b80-4a0b-a982-8865152b2c82"
migrations_dir = "migrations/merchant-official-api"
migrations_table = "merchant_official_api_migrations"

[[env.preview.durable_objects.bindings]]
name = "GLOBAL_RATE_LIMITER"
class_name = "GlobalRateLimiter"
script_name = "exportflow-global-rate-limiter"
