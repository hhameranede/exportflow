# Cloudflare Pages Functions runtime and Node compatibility.
name = "exportflow"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

# Safe local defaults: local Pages development uses the isolated Preview resources.
[vars]
EXPORTFLOW_ENV = "local"

[[d1_databases]]
binding = "MERCHANT_DB"
database_name = "exportflow-intelligence-preview-db"
database_id = "9657dfdc-5b80-4a0b-a982-8865152b2c82"
preview_database_id = "DB"
migrations_dir = "migrations"

# Preview KV stores compact manifests/cursors only, never raw company rows.
[[kv_namespaces]]
binding = "COMPANY_SNAPSHOT_KV"
id = "27b82210532f4ebf9df94b3f1003d74b"
preview_id = "27b82210532f4ebf9df94b3f1003d74b"

# The Durable Object namespace is owned by a separate Worker.
[[durable_objects.bindings]]
name = "GLOBAL_RATE_LIMITER"
class_name = "GlobalRateLimiter"
script_name = "exportflow-global-rate-limiter"

# Pages Preview explicitly uses the isolated Preview D1 and KV namespaces.
[env.preview.vars]
EXPORTFLOW_ENV = "preview"

[[env.preview.d1_databases]]
binding = "MERCHANT_DB"
database_name = "exportflow-intelligence-preview-db"
database_id = "9657dfdc-5b80-4a0b-a982-8865152b2c82"
preview_database_id = "DB"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "COMPANY_SNAPSHOT_KV"
id = "27b82210532f4ebf9df94b3f1003d74b"

[[env.preview.durable_objects.bindings]]
name = "GLOBAL_RATE_LIMITER"
class_name = "GlobalRateLimiter"
script_name = "exportflow-global-rate-limiter"

# Production is explicitly mapped to separate resources; no Production data migration is run here.
[env.production.vars]
EXPORTFLOW_ENV = "production"

[[env.production.d1_databases]]
binding = "MERCHANT_DB"
database_name = "exportflow-intelligence-db"
database_id = "3e91ee40-75f8-45b3-9459-a4c306f52b3b"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "COMPANY_SNAPSHOT_KV"
id = "cfe7b730249d4b24a6d02f2a8c5bc155"

[[env.production.durable_objects.bindings]]
name = "GLOBAL_RATE_LIMITER"
class_name = "GlobalRateLimiter"
script_name = "exportflow-global-rate-limiter"
